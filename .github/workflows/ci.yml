name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release-version
      - run: pnpm test
      - run: pnpm benchmark:markdown:gate
      - run: pnpm build
      - run: pnpm check:startup
      - run: pnpm build:public
      - run: pnpm check:public
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml --features public-core
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm check:rust:clippy
      - run: pnpm check:rust:clippy:public
      - run: pnpm check:rust:clippy:e2e
      - run: pnpm desktop:e2e
