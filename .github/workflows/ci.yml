name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Reject accidental secrets and personal vaults
        shell: pwsh
        run: |
          if (git ls-files | Select-String -Pattern '(^|/)(\.env|ToolKnitVault|models|engines)/') { throw 'A local secret, vault or model file is tracked.' }
